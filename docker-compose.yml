services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      MODEL_PATH: ${MODEL_PATH:-/app/yolo11n.pt}
      INFERENCE_CONFIDENCE_THRESHOLD: ${INFERENCE_CONFIDENCE_THRESHOLD:-0.15}
      PERSON_CONFIDENCE_THRESHOLD: ${PERSON_CONFIDENCE_THRESHOLD:-0.50}
      BALL_CONFIDENCE_THRESHOLD: ${BALL_CONFIDENCE_THRESHOLD:-0.15}
      INFERENCE_IOU_THRESHOLD: ${INFERENCE_IOU_THRESHOLD:-0.55}
      YOLO_CONFIG_DIR: /root/.cache/ultralytics
      CORS_ORIGINS: http://localhost:4173,http://localhost:5173,http://127.0.0.1:4173,http://127.0.0.1:5173
    ports:
      - "8000:8000"
    volumes:
      - model-cache:/root/.cache
      - ./backend/models:/app/backend/models

  frontend:
    build:
      context: frontend
      args:
        VITE_API_URL: http://127.0.0.1:8000
    depends_on:
      - backend
    ports:
      - "4173:80"

volumes:
  model-cache:

